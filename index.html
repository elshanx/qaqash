<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="pill" data-mood="idle">
      <div id="bar"><span id="face"><i></i><i></i></span><span id="status">peep</span></div>
      <div id="drawer">
        <div id="content">
          <ul id="sessions" hidden></ul>
          <div id="ask" hidden>
            <div id="head">
              <div id="icon"></div>
              <div id="titles">
                <div id="kicker"></div>
                <div id="tool"></div>
              </div>
              <div id="actions">
                <button id="deny" class="round" aria-label="Deny">
                  <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" /></svg>
                </button>
                <button id="allow" class="round" aria-label="Allow">
                  <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
                </button>
              </div>
            </div>
            <pre id="detail"></pre>
            <div id="questions"></div>
            <div id="footer">
              <button id="back">Back</button>
              <button id="next">Next</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
