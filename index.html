<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <div id="island" data-mood="idle">
      <div id="liquid"><div id="drop"></div><div id="shape"><div id="glow"></div></div></div>
      <div id="bar">
        <span id="face"><i></i><i></i></span>
        <span id="mini-art" class="art"></span>
        <span id="status">qaqash</span>
        <span id="bars" class="eq"><i></i><i></i><i></i><i></i></span>
      </div>
      <div id="drawer">
        <div id="content">
          <nav id="tabs" hidden>
            <button data-tab="home" aria-label="Home">
              <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z" /></svg>
            </button>
            <button data-tab="sessions" aria-label="Sessions">
              <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9" /></svg>
            </button>
            <span class="spacer"></span>
            <button data-tab="settings" aria-label="Settings">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" /></svg>
            </button>
            <button id="sound" aria-label="Sound">
              <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" /><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5" /></svg>
            </button>
          </nav>
          <div id="settings" hidden></div>
          <div id="activity" hidden>
            <div id="who">
              <div id="avatar"><i></i><i></i></div>
              <div id="who-name"></div>
              <div id="who-app">Claude Code</div>
              <ol id="steps"></ol>
            </div>
            <div id="code" data-open-source>
              <div id="tab"><span id="lang"></span><span id="file"></span><span id="file-path"></span></div>
              <div id="diff" class="diff"></div>
            </div>
          </div>
          <div id="mini-player" hidden>
            <span class="art" data-open-source></span>
            <span id="mini-title" data-open-source></span>
            <button data-action="toggle" aria-label="Play or pause" id="mini-toggle">
              <svg viewBox="0 0 24 24" class="pause"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" /></svg>
              <svg viewBox="0 0 24 24" class="play"><path d="M7 4.5L19.5 12L7 19.5Z" /></svg>
            </button>
          </div>
          <div id="mini-vscode" class="mini-row" data-open-source hidden>
            <span class="code-icon small"><svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5" /></svg></span>
            <span class="mini-text"></span>
          </div>
          <div id="player" hidden>
            <div id="track">
              <div id="art" class="art" data-open-source></div>
              <div id="track-text" data-open-source>
                <div id="title"></div>
                <div id="artist"></div>
              </div>
              <span id="track-eq" class="eq"><i></i><i></i><i></i><i></i></span>
            </div>
            <div id="progress-row">
              <span id="elapsed"></span>
              <div id="progress"><div id="progress-fill"></div></div>
              <span id="remaining"></span>
            </div>
            <div id="controls">
              <button data-action="previous" aria-label="Previous">
                <svg viewBox="0 0 24 24"><path d="M11 6L3.5 12L11 18ZM20.5 6L13 12L20.5 18Z" /></svg>
              </button>
              <button data-action="toggle" aria-label="Play or pause" id="toggle">
                <svg viewBox="0 0 24 24" id="pause-icon"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" /></svg>
                <svg viewBox="0 0 24 24" id="play-icon"><path d="M7 4.5L19.5 12L7 19.5Z" /></svg>
              </button>
              <button data-action="next" aria-label="Next">
                <svg viewBox="0 0 24 24"><path d="M13 6L20.5 12L13 18ZM3.5 6L11 12L3.5 18Z" /></svg>
              </button>
            </div>
          </div>
          <div id="vscode-card" data-open-source hidden>
            <span class="code-icon"><svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5" /></svg></span>
            <div class="card-text">
              <div class="card-title"></div>
              <div class="card-sub"></div>
            </div>
          </div>
          <ul id="sessions" hidden></ul>
          <div id="ask" hidden>
            <div id="head">
              <div id="icon"></div>
              <div id="titles">
                <div id="kicker"></div>
                <div id="tool"></div>
              </div>
              <div id="actions">
                <button id="deny" class="round" aria-label="Deny">
                  <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" /></svg>
                </button>
                <button id="allow" class="round" aria-label="Allow">
                  <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
                </button>
              </div>
            </div>
            <pre id="detail"></pre>
            <div id="questions"></div>
            <div id="footer">
              <button id="back">Back</button>
              <button id="next">Next</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
