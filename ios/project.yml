name: Qaqash
options:
  bundleIdPrefix: dev.elshanx.qaqash
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2V38URP4K7
targets:
  Qaqash:
    type: application
    platform: iOS
    sources: [Qaqash, Shared]
    dependencies:
      - target: Live
    info:
      path: Qaqash/Info.plist
      properties:
        CFBundleDisplayName: Qaqash
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Scan the pairing code shown on your Mac.
        NSFaceIDUsageDescription: Confirm before letting Claude run something on your Mac.
        NSLocalNetworkUsageDescription: Qaqash talks to your Mac over your Wi-Fi.
        NSBonjourServices: [_qaqash._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.elshanx.qaqash.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  Live:
    type: app-extension
    platform: iOS
    sources: [Live, Shared]
    info:
      path: Live/Info.plist
      properties:
        CFBundleDisplayName: Qaqash
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.elshanx.qaqash.ios.live
