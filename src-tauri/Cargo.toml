[package]
name = "peep"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
objc2 = "0.6"
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
serde_json = "1"
rcgen = "0.14.10"
qrcode = "0.14.1"
getrandom = "0.4.3"
sha2 = "0.11.1"
